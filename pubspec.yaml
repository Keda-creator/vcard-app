name: bizkonec
description: "A modern, production-ready Digital Card & vCard App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^12.1.3
  app_links: ^6.3.2
  
  # UI & Components
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0
  url_launcher: ^6.2.1
  
  # Features
  camera: 0.10.6
  image_picker: 1.0.7
  image_cropper: 12.2.1
  mobile_scanner: 5.1.1
  nfc_manager: 4.2.1
  app_settings: ^5.1.1
  cunning_document_scanner: ^1.2.0
  
  # Data & Persistence
  http: ^1.1.0
  html: ^0.15.4
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  intl: ^0.18.1
  uuid: ^4.6.0
  
  # Animations
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
